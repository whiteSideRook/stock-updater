name: Daily Shopify Inventory Updates

on:
  schedule:
    - cron: '0 9 * * *' # AM
  workflow_dispatch:

concurrency:
  group: daily-shopify-inventory
  cancel-in-progress: false

jobs:
  update_inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas chardet selenium webdriver-manager

      # The checkpoint is stored in the Actions cache, not committed to this
      # public repository. A cache miss is safe: ongoing_state.py bootstraps.
      - name: Restore private Ongoing checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .private_state/ongoing_state.json
          key: ongoing-state-${{ github.run_id }}
          restore-keys: |
            ongoing-state-

      - name: Refresh Ongoing checkpoint
        run: python ongoing_state.py
        env:
          ONGOING_STATE_FILE: .private_state/ongoing_state.json
          ONGOING_BASE_URL: ${{ secrets.ONGOING_BASE_URL }}
          ONGOING_USERNAME: ${{ secrets.ONGOING_USERNAME }}
          ONGOING_PASSWORD: ${{ secrets.ONGOING_PASSWORD }}
          ONGOING_GOODS_OWNER_ID: ${{ secrets.ONGOING_GOODS_OWNER_ID }}

      - name: Run Selenium to Shopify updater
        run: python seleniumToShopifyUpdater.py
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Run second inventory script
        run: python secondStockUpdater.py
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FILENAME: ${{ secrets.FILENAME }}

      - name: Reactivate archived products with local surplus
        run: python activate_local_surplus.py
        env:
          ONGOING_STATE_FILE: .private_state/ongoing_state.json
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # Save only after the complete stock/activation workflow succeeds.
      - name: Save private Ongoing checkpoint
        uses: actions/cache/save@v4
        with:
          path: .private_state/ongoing_state.json
          key: ongoing-state-${{ github.run_id }}
