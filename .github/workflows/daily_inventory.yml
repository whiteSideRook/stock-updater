name: Daily Shopify Inventory Updates

permissions:
  contents: write

on:
  schedule:
    - cron: '0 9 * * *' # AM
  workflow_dispatch:

concurrency:
  group: daily-shopify-inventory
  cancel-in-progress: false

jobs:
  update_inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas chardet selenium webdriver-manager

      - name: Refresh Ongoing checkpoint
        run: python ongoing_state.py
        env:
          ONGOING_BASE_URL: ${{ secrets.ONGOING_BASE_URL }}
          ONGOING_USERNAME: ${{ secrets.ONGOING_USERNAME }}
          ONGOING_PASSWORD: ${{ secrets.ONGOING_PASSWORD }}
          ONGOING_GOODS_OWNER_ID: ${{ secrets.ONGOING_GOODS_OWNER_ID }}

      - name: Run Selenium to Shopify updater
        run: python seleniumToShopifyUpdater.py
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Run second inventory script
        run: python secondStockUpdater.py
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FILENAME: ${{ secrets.FILENAME }}

      - name: Reactivate archived products with local surplus
        run: python activate_local_surplus.py
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # Commit only after every preceding step succeeds. If a stock updater or
      # activation fails, the checkpoint is not advanced in Git.
      - name: Commit Ongoing checkpoint
        run: |
          if git diff --quiet -- ongoing_state.json; then
            echo "No checkpoint changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ongoing_state.json
          git commit -m "Update Ongoing inventory checkpoint"
          git push
